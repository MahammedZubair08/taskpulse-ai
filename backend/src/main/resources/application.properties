
# Application Configuration
spring.application.name=TaskPulse AI Backend
server.port=8080
server.servlet.context-path=/

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/taskpulse
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.zubair.taskpulse=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# JWT Configuration
jwt.secret=myVerySecretKeyThatIsAtLeast32CharactersLongForHS256Algorithm
jwt.expiration=86400000

# Security Configuration (Development Only - Change in Production)
spring.security.user.name=admin
spring.security.user.password=admin123

# ===============================
# Google Gemini / Spring AI
# ===============================

spring.ai.google.genai.api-key=#apikey
spring.ai.google.genai.chat.options.model=gemini-3.6-flash


spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis