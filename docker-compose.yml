version: '3.8'

services:
  # Add services here later
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: taskpulse
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
